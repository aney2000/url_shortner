# .rubocop.yml
AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - 'vendor/**/*'
    - 'spec/**/*'

Style/StringLiterals:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

# Sinatra route modules use a single `registered` method by convention.
# These methods are route definitions, not complex business logic.
Metrics/MethodLength:
  Exclude:
    - 'routes/**/*'

Metrics/AbcSize:
  Exclude:
    - 'routes/**/*'
